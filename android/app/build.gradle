plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
//    implementation "org.retroshare.service:libretroshare-MinApiLevel21-release:46e37897"
    implementation "org.retroshare.service:libretroshare-MinApiLevel24-debug:46e37897"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

def getAppVersionName = { ->
    if (flutterVersionName != null && flutterVersionName != '1.0') {
        return flutterVersionName.split('\\+')[0]
    }
    def pubspecFile = rootProject.file('../pubspec.yaml')
    if (pubspecFile.exists()) {
        def matcher = pubspecFile.text =~ /version:\s*([0-9]+\.[0-9]+\.[0-9]+)/
        if (matcher.find()) {
            return matcher.group(1)
        }
    }
    return flutterVersionName ? flutterVersionName.split('\\+')[0] : '1.0.0'
}

android {
 
    namespace = "cc.retroshare.retroshare"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "cc.retroshare.retroshare"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 28
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE']
            pickFirsts += ['META-INF/atomicfu.kotlin_module', 'META-INF/proguard/coroutines.pro']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def version = getAppVersionName()
            def gitHash = getGitHash()
            def date = new Date().format('yyyyMMdd')
            outputFileName = "retroshare-mobile-v${version}-${gitHash}-${date}-${variant.name}.apk"
        }
    }

}

flutter {
    source = "../.."
}
