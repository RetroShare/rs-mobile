name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      aar_url:
        description: 'Direct download URL for custom libretroshare AAR (Optional)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Prepare AAR Dependency (if custom AAR URL is provided)
        if: ${{ inputs.aar_url != '' }}
        run: |
          mkdir -p android/app/libs
          echo "Downloading custom AAR from ${{ inputs.aar_url }}..."
          curl -L "${{ inputs.aar_url }}" -o android/app/libs/libretroshare-MinApiLevel24-debug.aar
          echo "Updating build.gradle to reference local AAR file..."
          sed -i "s|implementation \"org.retroshare.service:libretroshare.*\"|implementation files('libs/libretroshare-MinApiLevel24-debug.aar')|g" android/app/build.gradle

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build APK (${{ inputs.build_mode }}) - diagnostic
        run: |
          set -euo pipefail
          mkdir -p buildlogs

          echo "=== Versions ==="
          flutter --version || true
          java -version || true
          echo "=== Flutter doctor ==="
          flutter doctor -v || true

          echo "=== Pub get ==="
          flutter pub get || true

          if [ "${{ inputs.build_mode }}" = "release" ]; then
            echo "Running flutter build apk --release (verbose)"
            # fail the job if flutter build fails so we don't try to upload nonexistent APKs
            flutter build apk --release --no-codesign -v > buildlogs/flutter_build_verbose.log 2>&1
            echo "If flutter build failed, running Gradle fallback to get stacktrace..."
            (cd android && ./gradlew assembleRelease --stacktrace --info) > buildlogs/gradle_fallback_release.log 2>&1 || true
          else
            echo "Running flutter build apk --debug (verbose)"
            # fail the job if flutter build fails so we don't try to upload nonexistent APKs
            flutter build apk --debug -v > buildlogs/flutter_build_verbose.log 2>&1
            echo "If flutter build failed, running Gradle fallback to get stacktrace..."
            (cd android && ./gradlew assembleDebug --stacktrace --info) > buildlogs/gradle_fallback_debug.log 2>&1 || true
          fi

          echo "=== APK files (if any) ==="
          find build -type f -name '*.apk' -ls || true

      - name: Upload build logs artifact (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: buildlogs
          retention-days: 7

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rs-mobile-${{ inputs.build_mode }}-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
